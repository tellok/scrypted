name: "tagged-release"

on:
  push:
    tags:
    - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on:

    - self-hosted
    - tower
    - "ubuntu-latest"
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
